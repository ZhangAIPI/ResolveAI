[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai"
version = "0.1.0"
description = "Interactive visual evidence acquisition research"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
model = ["torch>=2.4", "transformers==4.57.6", "accelerate>=0.34", "peft"]

[tool.setuptools.packages.find]
where = ["src"]
